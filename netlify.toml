[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22.22.2"

# NOTE: /studio/* deliberately gets no headers block here. Netlify custom
# headers only apply to responses served from the static store (prerendered
# pages and assets); /studio opts out of prerendering, so its SPA shell is
# served by the adapter's render function, which netlify.toml headers never
# reach — a /studio block here is dead configuration. The Studio's relaxed
# CSP, X-Frame-Options: SAMEORIGIN, and X-Robots-Tag: noindex ship from app
# code instead: see src/hooks.server.ts. This file stays the source of truth
# for everything static (the block below).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Two-year max-age with subdomain coverage and the preload-list opt-in.
    # Once shipped, removing HSTS from a domain still on the preload list
    # requires submission to hstspreload.org's removal form; commit only when
    # the production cert is stable and you intend to keep https-only.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # `media-src` covers the inline voice sample on the about section: the
    # audio file is loaded from `cdn.sanity.io` by the `<audio>` element.
    # Without an explicit `media-src` the directive falls back to
    # `default-src 'self'`, which would block the cross-origin audio in
    # production (local `npm run preview` doesn't enforce these headers,
    # so the gap only surfaces post-deploy — we got bitten by exactly
    # this on v1.1.1's connect-src GROQ fetch). Image assets stay on the
    # existing `img-src` allowance.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cdn.sanity.io; media-src 'self' https://cdn.sanity.io; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
