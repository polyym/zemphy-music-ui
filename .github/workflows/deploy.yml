name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Sanity webhook fires this event on document publish; the chain is
  # Sanity webhook -> repository_dispatch -> this workflow -> Netlify CLI
  # upload. The polyym deploy model intentionally bypasses Netlify's own
  # auto-build path so a content publish runs through the same lint and
  # type-check gates as a code change. Wiring details (the webhook URL, the
  # GitHub PAT, the Netlify site ID and auth token) are kept private since
  # this repo is public.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # Mirror the full tests.yml gate set inline so this workflow does not
      # rely on tests.yml having passed in parallel — branch protection makes
      # that the usual case but it is one configuration switch away from a
      # broken artefact getting deployed.
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}

      # `--no-build` tells netlify-cli to upload `build/` directly instead of
      # invoking @netlify/build (which would re-run `[build] command` from
      # netlify.toml — wasting CI time, and failing if env vars aren't also
      # propagated into this step). The build that GHA just produced is the
      # canonical artefact. PUBLIC_SANITY_* is also passed in as a safety net
      # so a future netlify-cli that ignores --no-build still has what it
      # needs to re-build.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: npx netlify-cli@latest deploy --no-build --dir=build --message="PR #${{ github.event.pull_request.number }} @ ${{ github.sha }}"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}

      - name: Deploy to production
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'repository_dispatch'
        run: npx netlify-cli@latest deploy --no-build --prod --dir=build --message="${{ github.event_name == 'repository_dispatch' && 'Sanity publish' || 'Commit' }} ${{ github.sha }}"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
