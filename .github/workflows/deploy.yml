name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Sanity webhook fires this event on document publish; the chain is
  # Sanity webhook -> repository_dispatch -> this workflow -> Netlify CLI
  # upload. The polyym deploy model intentionally bypasses Netlify's own
  # auto-build path so a content publish runs through the same lint and
  # type-check gates as a code change. Wiring details (the webhook URL, the
  # GitHub PAT, the Netlify site ID and auth token) are kept private since
  # this repo is public.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level env so every step (including npm install's `prepare` hook,
    # which runs `svelte-kit sync`) sees the Sanity vars. Sync uses them to
    # generate the `$env/static/public` ambient declarations in
    # `.svelte-kit/ambient.d.ts`; without those declarations the static-env
    # imports in `src/lib/sanity/client.ts` resolve to `error`-typed values
    # and `npm run lint` (typescript-eslint strict-type-checked) flags them
    # as "Unsafe assignment of an error typed value" on the `projectId` /
    # `dataset` fields. Step-level env on `npm run build` alone is not enough
    # because lint/test/check run before build.
    #
    # The `||` fallbacks keep fork PRs green: GitHub passes neither secrets
    # nor repository variables to `pull_request` runs from forks, so without
    # them the Sanity vars arrive empty and lint fails as described above.
    # The fallback values are public (they mirror `.env.example`).
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID || '5b75k1rw' }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Node 22 runners bundle npm 10, whose `npm ci` validation disagrees
      # with this repo's npm 11-authored package-lock.json: npm 10 demands a
      # lock entry for tsconfck's OPTIONAL `typescript ^5` peer (the root has
      # typescript 6) and fails with "Missing: typescript@5.9.3 from lock
      # file", while npm 11 honours `peerDependenciesMeta.optional` and
      # validates the same lock cleanly. Pin npm to the same major as the
      # `packageManager` field in package.json so the lock is checked under
      # the rules it was written with; bump the two together.
      - run: npm install -g npm@11
      # `npm ci` is lockfile-faithful: it fails loudly if package.json and
      # package-lock.json drift, instead of silently rewriting the lock in CI.
      - run: npm ci --no-audit --no-fund
      # Mirror the full tests.yml gate set inline so this workflow does not
      # rely on tests.yml having passed in parallel — branch protection makes
      # that the usual case but it is one configuration switch away from a
      # broken artefact getting deployed.
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      - run: npm run build

      # `--no-build` tells netlify-cli to upload `build/` directly instead of
      # invoking @netlify/build (which would re-run `[build] command` from
      # netlify.toml — wasting CI time, and failing if env vars aren't also
      # propagated into this step). The build that GHA just produced is the
      # canonical artefact. PUBLIC_SANITY_* is also passed in as a safety net
      # so a future netlify-cli that ignores --no-build still has what it
      # needs to re-build.
      #
      # netlify-cli is pinned to a major so a breaking CLI release can't take
      # down the deploy path at an arbitrary time (including a Sanity-publish
      # dispatch); bump the pin deliberately.
      #
      # Skipped for fork PRs: GitHub withholds secrets from fork-triggered
      # runs, so the deploy call would fail on an empty NETLIFY_AUTH_TOKEN.
      # The CI gates above still run for forks via the env fallbacks.
      - name: Deploy preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npx netlify-cli@26 deploy --no-build --dir=build --message="PR #${{ github.event.pull_request.number }} @ ${{ github.sha }}"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID || '5b75k1rw' }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}

      - name: Deploy to production
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'repository_dispatch'
        run: npx netlify-cli@26 deploy --no-build --prod --dir=build --message="${{ github.event_name == 'repository_dispatch' && 'Sanity publish' || 'Commit' }} ${{ github.sha }}"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID || '5b75k1rw' }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
