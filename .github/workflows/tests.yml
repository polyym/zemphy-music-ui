name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level env so every step (including npm install's `prepare` hook,
    # which runs `svelte-kit sync`) sees the Sanity vars. Sync uses them to
    # generate the `$env/static/public` ambient declarations in
    # `.svelte-kit/ambient.d.ts`; without those declarations the static-env
    # imports in `src/lib/sanity/client.ts` resolve to `error`-typed values
    # and `npm run lint` (typescript-eslint strict-type-checked) flags them
    # as "Unsafe assignment of an error typed value" on the `projectId` /
    # `dataset` fields.
    #
    # The `||` fallbacks keep fork PRs green: GitHub passes neither secrets
    # nor repository variables to `pull_request` runs from forks, so without
    # them the Sanity vars arrive empty and lint fails as described above.
    # The fallback values are public (they mirror `.env.example`).
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID || '5b75k1rw' }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Node 22 runners bundle npm 10, whose `npm ci` validation disagrees
      # with this repo's npm 11-authored package-lock.json: npm 10 demands a
      # lock entry for tsconfck's OPTIONAL `typescript ^5` peer (the root has
      # typescript 6) and fails with "Missing: typescript@5.9.3 from lock
      # file", while npm 11 honours `peerDependenciesMeta.optional` and
      # validates the same lock cleanly. Pin npm to the same major as the
      # `packageManager` field in package.json so the lock is checked under
      # the rules it was written with; bump the two together.
      - run: npm install -g npm@11
      # `npm ci` is lockfile-faithful: it fails loudly if package.json and
      # package-lock.json drift, instead of silently rewriting the lock in CI.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      - run: npm run build
