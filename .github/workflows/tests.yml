name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level env so every step (including npm install's `prepare` hook,
    # which runs `svelte-kit sync`) sees the Sanity vars. Sync uses them to
    # generate the `$env/static/public` ambient declarations in
    # `.svelte-kit/ambient.d.ts`; without those declarations the static-env
    # imports in `src/lib/sanity/client.ts` resolve to `error`-typed values
    # and `npm run lint` (typescript-eslint strict-type-checked) flags them
    # as "Unsafe assignment of an error typed value" on the `projectId` /
    # `dataset` fields.
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      - run: npm run build
